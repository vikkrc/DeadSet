<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dead Set — concept mockups</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/public/styles.css">
<style>
  /* Mockup canvas: static artboards; animations are described in captions. */
  *, *::before, *::after { animation-play-state: paused !important; animation-delay: -10s !important; }
  body { background: #050505; padding: 40px; display: grid; gap: 60px; justify-items: start; }
  body::before { display: none; }
  .label { font: 600 13px var(--sans); color: #888; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 10px; }
  .art { position: relative; overflow: hidden; background: var(--soot); color: var(--bone); }
  .art::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(110% 55% at 50% -12%, var(--glow), transparent 62%); }
  .phone { width: 390px; height: 844px; }
  .desk { width: 1280px; height: 800px; }
  .tv { width: 1600px; height: 900px; }
  .art.night { --soot: #090b10; --soot-2: #10131b; --soot-3: #181d28; --bone: #dde2ea; --bone-2: #a9b2c0; --ash: #737d8e; --ash-2: #4b5363; --line: rgba(205,215,232,.11); --line-2: rgba(205,215,232,.24); --glow: rgba(120,155,215,.1); --moonlight: #e6ecf5; }
  .abs { position: absolute; }
  .phone .topbar { display: flex !important; }
  .phone .dock { left: 0 !important; }
  .phone .mobile-only { display: contents !important; }

  /* ── A: Empty Table ─────────────────────────────────────────── */
  .a-top { display: flex; justify-content: space-between; align-items: center; padding: 18px 18px 0; position: relative; z-index: 2; }
  .a-ring { position: relative; width: 350px; aspect-ratio: 1; margin: 6px auto 0; }
  .a-ring .ring-table { inset: 19%; background: radial-gradient(circle at 50% 42%, rgba(236,229,213,.07), transparent 70%), radial-gradient(circle at 50% 50%, #1c1815, #110f0e); }
  .a-title { position: absolute; inset: 22%; display: grid; place-content: center; text-align: center; z-index: 3; }
  .a-title h1 { font: 400 64px/.82 var(--serif); letter-spacing: -.04em; }
  .a-title h1 i { color: var(--blood-ink); }
  .a-title p { font: italic 400 14px/1.3 var(--serif); color: var(--bone-2); margin-top: 8px; }
  .chair { position: absolute; transform: translate(-50%,-50%); width: 46px; height: 46px; border-radius: 50%; border: 1px dashed var(--line-2); display: grid; place-items: center; }
  .chair .sigil { inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); position: absolute; stroke: var(--ash-2); fill: none; stroke-width: 1.4; }
  .chair.ghost { border-style: solid; border-color: rgba(236,229,213,.28); background: radial-gradient(circle, rgba(236,229,213,.06), transparent 70%); }
  .chair.ghost::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: rgba(236,229,213,.35); box-shadow: 0 0 18px rgba(236,229,213,.35); }
  .chair.red { border: 1px solid rgba(226,88,94,.7); box-shadow: 0 0 26px rgba(226,88,94,.35), inset 0 0 14px rgba(179,36,45,.35); }
  .chair.red::after { content: ''; width: 8px; height: 8px; background: var(--blood); transform: rotate(45deg); box-shadow: 0 0 12px rgba(226,88,94,.8); }
  .whisper { text-align: center; font: italic 400 15px/1.35 var(--serif); color: var(--ash); margin: 8px 30px 0; }
  .whisper b { color: var(--bone-2); font-weight: 400; }
  .a-panel { margin: 18px 16px 0; display: grid; gap: 14px; }
  .code-in { display: flex; gap: 6px; justify-content: center; }
  .code-in span { width: 44px; height: 54px; border: 1px solid var(--line-2); border-radius: 4px; display: grid; place-items: center; font: 500 24px var(--mono); background: var(--soot-2); }
  .code-in span.cur { border-color: var(--bone); box-shadow: 0 0 0 3px rgba(236,229,213,.1); }
  .code-in span.cur::after { content: ''; width: 2px; height: 26px; background: var(--bone); }
  .foot { text-align: center; font: 600 10px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ash-2); }

  /* ── E: Invitation ───────────────────────────────────────────── */
  .inv-bg { position: absolute; inset: 0; background: radial-gradient(90% 55% at 50% 42%, #221b17, #0b0908 70%); }
  .envelope { position: absolute; left: 50%; top: 300px; width: 320px; height: 214px; transform: translate(-50%,-50%) rotate(-3deg); background: linear-gradient(160deg, #e9e1cf, #d8ceb8); border-radius: 4px; box-shadow: 0 40px 70px -20px rgba(0,0,0,.9), inset 0 0 0 1px rgba(0,0,0,.08); }
  .envelope::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom right, transparent 49.6%, rgba(0,0,0,.09) 50%, transparent 50.4%), linear-gradient(to bottom left, transparent 49.6%, rgba(0,0,0,.09) 50%, transparent 50.4%); }
  .envelope .flap { position: absolute; left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(180deg, #ddd3bd, #cfc4ac); clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .envelope .addr { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; color: #3a2f27; font: italic 400 19px/1.2 var(--serif); }
  .envelope .addr small { display: block; font: 600 9px var(--sans); letter-spacing: .2em; text-transform: uppercase; font-style: normal; color: #7a6b5c; margin-top: 6px; }
  .wax { position: absolute; left: 50%; top: 104px; width: 74px; height: 74px; transform: translate(-50%,-50%); border-radius: 46% 54% 50% 50% / 52% 48% 52% 48%; background: radial-gradient(circle at 38% 34%, #d0444c, #8f1a22 60%, #6a1118); box-shadow: 0 6px 14px rgba(0,0,0,.45), inset 0 -4px 8px rgba(0,0,0,.35); display: grid; place-items: center; }
  .wax::before { content: ''; position: absolute; inset: 9px; border-radius: 50%; border: 1px solid rgba(255,220,210,.25); box-shadow: inset 0 2px 4px rgba(0,0,0,.3); }
  .wax span { font: italic 400 26px/1 var(--serif); color: rgba(255,225,215,.82); text-shadow: 0 1px 1px rgba(0,0,0,.4); }
  .hold-ring { position: absolute; left: 50%; top: 104px; width: 104px; height: 104px; transform: translate(-50%,-50%); }
  .hold-ring circle { fill: none; stroke: rgba(255,230,220,.55); stroke-width: 2; stroke-dasharray: 100; stroke-dashoffset: 38; transform: rotate(-90deg); transform-origin: center; stroke-linecap: round; }
  .inv-hint { position: absolute; left: 0; right: 0; text-align: center; }
  .letter { position: absolute; left: 22px; right: 22px; top: 92px; padding: 34px 26px 26px; background: linear-gradient(170deg, #efe8d8, #e2d8c3); color: #2a221d; border-radius: 3px; box-shadow: 0 50px 80px -30px rgba(0,0,0,.95); }
  .letter::before { content: ''; position: absolute; inset: 8px; border: 1px solid rgba(60,45,35,.18); pointer-events: none; }
  .letter .k { font: 600 9.5px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: #8a7865; }
  .letter h2 { font: 400 40px/.95 var(--serif); margin: 10px 0 12px; color: #1e1814; }
  .letter h2 i { color: #a3242b; }
  .letter p { font: italic 400 17px/1.4 var(--serif); color: #4b3f35; }
  .letter .meta { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 18px; }
  .letter .meta span { font: 600 9px var(--sans); letter-spacing: .14em; text-transform: uppercase; border: 1px solid rgba(60,45,35,.3); border-radius: 10px; padding: 4px 8px; color: #5b4c40; }
  .sign { border-bottom: 1px solid #5b4c40; padding: 8px 2px; font: italic 400 26px var(--serif); color: #1e1814; display: flex; justify-content: space-between; align-items: end; }
  .sign small { font: 600 9px var(--sans); font-style: normal; letter-spacing: .2em; text-transform: uppercase; color: #8a7865; }
  .letter .btn { margin-top: 18px; width: 100%; }
  .seal-halves { position: absolute; left: 50%; top: 92px; transform: translate(-50%,-50%); width: 90px; height: 60px; }
  .seal-halves i { position: absolute; top: 10px; width: 36px; height: 40px; background: radial-gradient(circle at 55% 35%, #c33a43, #7d151d 80%); box-shadow: inset 0 -3px 5px rgba(0,0,0,.35); }
  .seal-halves i:first-child { left: 2px; transform: rotate(-24deg) translateY(4px); clip-path: polygon(30% 0, 100% 8%, 82% 34%, 100% 58%, 74% 100%, 18% 88%, 0 52%, 6% 18%); }
  .seal-halves i:last-child { right: 2px; transform: rotate(19deg) translateY(2px); clip-path: polygon(0 10%, 64% 0, 96% 22%, 100% 70%, 70% 100%, 12% 92%, 22% 62%, 4% 40%); }

  /* ── TV shared ──────────────────────────────────────────────── */
  .tv-head { position: absolute; top: 0; left: 0; right: 0; height: 92px; display: flex; align-items: center; gap: 24px; padding: 0 44px; z-index: 5; }
  .tv-head .ph { font: 400 46px/1 var(--serif); }
  .tv-head .ph i { font-style: italic; }
  .tv-head .step { font: 600 12px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--ash); }
  .tv-head .grow { flex: 1; }
  .tv-head .clk { font: 500 34px var(--mono); color: var(--bone); }
  .mute { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line-2); border-radius: 22px; padding: 8px 14px; font: 600 10.5px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--bone-2); }
  .mute .glyph { font-size: 18px; }
  .mute .eq { display: inline-flex; gap: 2px; align-items: end; height: 14px; }
  .mute .eq i { width: 2px; background: var(--bone-2); }
  .sky { position: absolute; left: 0; right: 0; top: 0; height: 160px; pointer-events: none; z-index: 1; }
  .sky path { fill: none; stroke: var(--line); stroke-width: 1; }
  .sky .done { stroke: var(--line-2); }
  .sky .orb { filter: drop-shadow(0 0 12px rgba(233,194,122,.7)); }
  .stage { position: absolute; left: 30px; top: 92px; width: 900px; height: 790px; }
  .bigring { position: absolute; left: 50%; top: 50%; width: 700px; height: 700px; transform: translate(-50%,-50%); }
  .bigring .ring { width: 700px; --tok: 74px; }
  .bigring .tok-name { font-size: 15px; margin-top: 10px; }
  .bigring .ring-table { inset: 20%; background: radial-gradient(circle at 50% 45%, rgba(233,194,122,.13), rgba(28,22,18,.9) 55%, #0f0c0b 75%); box-shadow: inset 0 0 90px rgba(0,0,0,.75), 0 0 0 18px rgba(30,24,20,.5), 0 0 0 19px var(--line); }
  .night .bigring .ring-table { background: radial-gradient(circle at 50% 30%, rgba(170,195,235,.14), rgba(16,20,30,.92) 55%, #0a0d14 75%); }
  .candle { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 16px; height: 60px; }
  .candle i { position: absolute; left: 3px; bottom: 0; width: 10px; height: 40px; background: linear-gradient(90deg, #cfc6b4, #efe8d8, #bfb5a2); border-radius: 2px; }
  .candle b { position: absolute; left: 2px; top: 0; width: 12px; height: 20px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: radial-gradient(circle at 50% 70%, #fff6d8, #f4c46c 45%, rgba(230,130,50,.0) 75%); box-shadow: 0 0 40px 18px rgba(240,180,90,.25); }
  .center-txt { position: absolute; left: 50%; top: 50%; transform: translate(-50%, 34px); text-align: center; width: 300px; }
  .center-txt .big { font: 400 54px/1 var(--serif); }
  .center-txt .sub { font: 600 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--ash); margin-top: 6px; }
  .spot { position: absolute; pointer-events: none; z-index: 1; }
  .threads { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: visible; }
  .threads path { fill: none; stroke: var(--blood-ink); stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .crack { position: absolute; inset: 0; width: 100%; height: 100%; stroke: rgba(226,88,94,.65); fill: none; stroke-width: 1.4; z-index: 2; }
  .plaques { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); display: flex; gap: 12px; z-index: 4; }
  .plaque { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--soot-2); font: 600 11px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ash); }
  .plaque .glyph { font-size: 20px; }
  .plaque.on { color: var(--bone); border-color: #e9c27a; box-shadow: 0 0 0 4px rgba(233,194,122,.1), 0 0 30px rgba(233,194,122,.18); }
  .plaque.on em { font: italic 400 15px var(--serif); text-transform: none; letter-spacing: 0; color: #e9c27a; }

  /* ── Chronicle / Gazette ────────────────────────────────────── */
  .chron { position: absolute; right: 36px; top: 112px; bottom: 30px; width: 600px; padding: 26px 28px; background: linear-gradient(180deg, color-mix(in srgb, var(--soot-2) 92%, transparent), var(--soot)); border: 1px solid var(--line); border-radius: 6px; z-index: 3; overflow: hidden; }
  .mast { text-align: center; border-bottom: 3px double var(--line-2); padding-bottom: 10px; }
  .mast h3 { font: 400 34px/1 var(--serif); letter-spacing: .02em; }
  .mast h3 i { color: var(--blood-ink); }
  .mast div { display: flex; justify-content: space-between; font: 600 10px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--ash); margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
  .edition { display: grid; grid-template-columns: 54px 1fr; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .edition .when { display: grid; justify-items: center; gap: 4px; align-content: start; }
  .edition .when .glyph { font-size: 26px; color: var(--bone-2); }
  .edition .when b { font: 400 22px/1 var(--serif); }
  .edition .when span { font: 600 9px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ash); }
  .edition h4 { margin: 0 0 8px; font: 400 25px/1.05 var(--serif); }
  .edition h4.dead { color: var(--blood-ink); }
  .events { display: flex; flex-wrap: wrap; gap: 6px; }
  .ev { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px 5px 6px; border: 1px solid var(--line-2); border-radius: 16px; font: 500 13px var(--sans); color: var(--bone-2); }
  .ev .glyph { font-size: 16px; }
  .ev .mini { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; font: 400 11px var(--serif); color: var(--bone); }
  .ev.kill { border-color: rgba(226,88,94,.5); color: var(--bone); }
  .ev.kill .glyph { color: var(--blood-ink); }
  .ev .arrow { color: var(--blood-ink); }
  .ev .tallyv { font: 500 11px var(--mono); color: var(--ash); margin-left: 2px; }
  .edition.today { background: linear-gradient(90deg, rgba(236,229,213,.04), transparent); }

  /* ── countdown pressure ─────────────────────────────────────── */
  .vignette { position: absolute; inset: 0; z-index: 6; pointer-events: none; box-shadow: inset 0 0 160px 40px rgba(120,10,16,.75), inset 0 0 0 3px rgba(226,88,94,.55); }
  .spark { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #ffb38a; box-shadow: 0 0 10px 3px rgba(255,130,80,.7); z-index: 7; }
  .heart { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font: 500 120px/1 var(--mono); color: var(--blood-ink); text-shadow: 0 0 40px rgba(226,88,94,.5); }

  /* ── Opening ceremony ───────────────────────────────────────── */
  .ccard { width: 230px; height: 322px; border-radius: 10px; border: 1px solid var(--line-2); outline: 1px solid var(--line); outline-offset: -8px; background: radial-gradient(90% 60% at 50% 30%, rgba(236,229,213,.08), transparent 70%), var(--soot-2); display: grid; align-content: center; justify-items: center; gap: 14px; text-align: center; padding: 20px; box-shadow: 0 40px 60px -26px rgba(0,0,0,.95); }
  .ccard .k { font: 600 11px var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--ash); }
  .ccard .glyph { font-size: 64px; color: var(--bone-2); stroke-width: 1; }
  .ccard b { font: 400 30px/1.05 var(--serif); font-weight: 400; }
  .ccard.back { background: repeating-linear-gradient(45deg, transparent 0 9px, var(--line) 9px 10px), repeating-linear-gradient(-45deg, transparent 0 9px, var(--line) 9px 10px), var(--soot-2); }
  .ccard.back b { font: italic 400 46px var(--serif); background: var(--soot-2); padding: 10px 18px; border: 1px solid var(--line-2); }
  .rcard { width: 200px; padding: 16px; border: 1px solid #e9c27a55; border-radius: 8px; background: var(--soot-2); display: grid; gap: 6px; }
  .rcard b { font: 400 22px var(--serif); font-weight: 400; }
  .rcard p { font-size: 12.5px; color: var(--bone-2); }
  .rcard .k { font: 600 9.5px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: #e9c27a; }

  /* ── Lobby showcase ─────────────────────────────────────────── */
  .deckrow { display: flex; gap: 12px; }
  .dcard { width: 108px; height: 150px; border: 1px solid var(--line-2); border-radius: 8px; background: linear-gradient(165deg, var(--soot-3), var(--soot-2)); display: grid; justify-items: center; align-content: center; gap: 8px; position: relative; }
  .dcard .glyph { font-size: 38px; stroke-width: 1.1; }
  .dcard b { font: 600 12px var(--sans); text-align: center; }
  .dcard i { position: absolute; top: 8px; right: 10px; font: 500 13px var(--mono); color: var(--ash); font-style: normal; }
  .dcard.death { border-color: rgba(226,88,94,.6); color: var(--blood-ink); }
  .dcard.secret { border-style: dashed; }
  .dcard.secret .q { font: italic 400 46px/1 var(--serif); color: var(--bone-2); }
  .dcard.rule { border-color: #e9c27a66; }
  .dcard.rule .glyph { color: #e9c27a; }
  .dcard.fd { background: repeating-linear-gradient(45deg, transparent 0 7px, var(--line) 7px 8px), var(--soot-2); }
  .drop { position: absolute; width: 2px; background: linear-gradient(transparent, rgba(236,229,213,.5)); }
  .mini-deck { display: flex; gap: 6px; overflow: hidden; }
  .mini-deck .dcard { width: 70px; height: 96px; flex: none; }
  .mini-deck .dcard .glyph { font-size: 26px; }
  .mini-deck .dcard b { font-size: 9.5px; }
  .mini-deck .dcard i { font-size: 10px; top: 5px; right: 7px; }
  .pool-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .pool-grid span { display: grid; justify-items: center; gap: 3px; padding: 7px 2px; border: 1px solid var(--line); border-radius: 6px; font: 600 8.5px var(--sans); text-align: center; color: var(--bone-2); }
  .pool-grid span .glyph { font-size: 20px; color: var(--bone); }
  .pool-grid span.off { opacity: .3; }
  .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .toggle-row b { font-weight: 500; display: block; font-size: 14px; }
  .toggle-row small { color: var(--ash); font-size: 12px; }
  .switch { width: 44px; height: 26px; border-radius: 13px; background: var(--bone); position: relative; flex: none; }
  .switch::after { content: ''; position: absolute; right: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--soot); }
  .switch.off { background: var(--soot-3); border: 1px solid var(--line-2); }
  .switch.off::after { left: 3px; right: auto; background: var(--ash); }

  /* ── Gazette front page ─────────────────────────────────────── */
  .paper { position: absolute; left: 50%; top: 50%; width: 1080px; height: 760px; transform: translate(-50%,-50%) rotate(-1deg); background: linear-gradient(170deg, #ece4d2, #dcd1ba); color: #1d1814; padding: 34px 46px; box-shadow: 0 60px 120px -30px rgba(0,0,0,.95); }
  .paper .mh { text-align: center; border-bottom: 4px double #1d1814; padding-bottom: 10px; }
  .paper .mh h2 { font: 400 76px/1 var(--serif); letter-spacing: .01em; }
  .paper .mh div { display: flex; justify-content: space-between; font: 600 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; border-top: 1px solid #1d1814; margin-top: 8px; padding-top: 6px; }
  .paper .hl { font: 400 92px/.92 var(--serif); text-align: center; margin: 22px 0 6px; letter-spacing: -.02em; }
  .paper .dk { font: italic 400 26px/1.25 var(--serif); text-align: center; color: #4b3f35; }
  .paper .cols { display: grid; grid-template-columns: 1fr 260px 1fr; gap: 30px; margin-top: 26px; border-top: 1px solid #1d1814; padding-top: 18px; }
  .paper .cols p { font: 400 16px/1.5 var(--serif); color: #2e2620; text-align: justify; }
  .paper .cols p::first-letter { font-size: 44px; float: left; line-height: .9; margin: 4px 6px 0 0; }
  .paper .photo { border: 1px solid #1d1814; padding: 10px; display: grid; justify-items: center; gap: 8px; text-align: center; font: italic 400 14px var(--serif); }
  .paper .photo .portrait { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #3a312a, #14100d); display: grid; place-items: center; color: #e9e0cc; font: 400 74px var(--serif); position: relative; }
  .paper .photo .portrait svg { position: absolute; inset: 0; stroke: #c94a50; fill: none; stroke-width: 1.4; }
  .paper .facts { display: grid; gap: 8px; align-content: start; }
  .paper .facts div { display: flex; justify-content: space-between; border-bottom: 1px dotted #1d181466; font: 600 12px var(--sans); letter-spacing: .1em; text-transform: uppercase; padding: 4px 0; }
  .paper .stampx { position: absolute; right: 70px; top: 190px; border: 4px solid #a3242b; color: #a3242b; font: 700 22px var(--sans); letter-spacing: .3em; padding: 8px 16px; transform: rotate(-10deg); opacity: .85; }

  /* phone-ceremony */
  .pc-cards { display: grid; gap: 10px; padding: 0 22px; }
  .pc-card { height: 104px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--soot-2); display: grid; grid-template-columns: 70px 1fr; align-items: center; padding: 0 16px; gap: 12px; }
  .pc-card .glyph { font-size: 40px; color: var(--bone-2); stroke-width: 1.1; }

     <div class="spot" style="left:calc(${bx}% - 50px);top:-120px;width:100px;height:calc(${by}% + 120px);background:linear-gradient(180deg, rgba(226,88,94,0), rgba(226,88,94,.14));clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)"></div>`;
  const center = night
    ? `<div class="ring-center" style="z-index:3">${moonSvg(.6, '', 110)}<div class="sub" style="font:600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ash);margin-top:10px">3 of 5 asleep</div></div>`
    : countdown ? `<div class="heart">0:07</div>` : `<div class="candle"><i></i><b></b></div><div class="center-txt"><div class="big">2</div><div class="sub">accused · discussion</div></div>`;
  const fog = night ? `<div class="abs" style="inset:0;z-index:2;pointer-events:none;background:radial-gradient(40% 18% at 30% 60%, rgba(180,195,220,.10), transparent 70%), radial-gradient(45% 16% at 70% 45%, rgba(180,195,220,.09), transparent 70%), radial-gradient(30% 14% at 55% 75%, rgba(180,195,220,.08), transparent 70%)"></div>` : '';
  return `${skyArc(night ? 0.35 : 0.62, night)}
  <div class="tv-head"><span class="ph">${night ? '<i>Night</i>' : 'Day'} <span style="font-size:.5em;vertical-align:.7em;color:var(--ash)">${night ? 'II' : 'III'}</span></span><span class="step">${night ? 'Night actions · Underground Bunker' : countdown ? 'Secret ballot · last seconds' : 'Discussion · Underground Bunker'}</span><span class="grow"></span><span class="clk ${countdown ? 'blood' : ''}">${night ? '1:12' : countdown ? '0:07' : '2:41'}</span><span class="mute">${G('bell')}<span class="eq"><i style="height:6px"></i><i style="height:12px"></i><i style="height:8px"></i></span> ${night ? 'Night score' : 'Day score'}</span></div>
  <div class="stage">
    <div class="bigring"><div class="ring" style="--tok:74px">
      <div class="ring-table"></div>${spot}${!night ? threadSvg([[5, 1, 3.5, .8], [3, 1, 1.8, .6], [1, 5, 1.8, .55], [4, 6, 1.2, .3], [7, 6, 1.2, .3]]) : ''}
      ${tokens(players)}${center}${fog}
    </div></div>
    <div class="plaques">
      <span class="plaque ${countdown ? 'on' : ''}">${G('magistrate')} Majority Rule ${countdown ? '<em>— in effect: more than 2½ needed</em>' : ''}</span>
      <span class="plaque ${!night && !countdown ? 'on' : ''}">${G('scroll')} Fog of War ${!night && !countdown ? '<em>— talk only to your neighbours</em>' : ''}</span>
    </div>
  </div>
  ${chronicle(night ? 'The town sleeps' : 'Bo and Fay stand accused', night)}
  ${countdown ? `<div class="vignette"></div>${Array.from({ length: 18 }, (_, i) => { const side = i % 4; const t = (i * 37) % 100; const s = side === 0 ? `left:${t}%;top:2px` : side === 1 ? `right:2px;top:${t}%` : side === 2 ? `left:${t}%;bottom:2px` : `left:2px;top:${t}%`; return `<span class="spark" style="${s}"></span>`; }).join('')}` : ''}`;
}

// ── Dawn Gazette front page (11) ─────────────────────────────────
const gazette = `<div class="paper">
  <div class="mh"><h2>The Dead Set Gazette</h2><div><span>Underground Bunker</span><span>Dawn of Day III</span><span>Price: one soul</span></div></div>
  <div class="hl">ADA FOUND DEAD</div>
  <p class="dk">Villagers wake to an empty chair; four others rose unharmed. The town will choose again before nightfall.</p>
  <div class="cols">
    <p>The bunker was quiet when the lamps came on. Ada, who had argued for patience at yesterday's trial, did not answer the morning bell. No one saw who came for her. Five remain, and at least one of them is lying.</p>
    <div class="photo"><div class="portrait">A<svg viewBox="0 0 100 100"><path d="M52 8 L46 30 L58 42 L44 60 L54 76 L48 94"/><path d="M58 42 L74 46"/></svg></div>Ada · seat I · Night II</div>
    <div class="facts"><div><span>Alive</span><span>5 of 8</span></div><div><span>Dead</span><span>Cy · Gus · Ada</span></div><div><span>Yesterday</span><span>Gus sentenced 5–2</span></div><div><span>Rules</span><span>Majority · Fog</span></div><div><span>Death wins at</span><span>a strict majority</span></div></div>
  </div>
  <div class="stampx">Extra</div>
</div>`;

const boards = [
  board('A · Empty Table — phone, host tab', 'phone', aPhone),
  board('A · Empty Table — phone, join tab', 'phone', aPhoneJoin),
  board('A · Empty Table — desktop', 'desk', aDesk),
  board('E · Invitation — sealed (link or QR)', 'phone', eSealed),
  board('E · Invitation — opened', 'phone', eOpen),
  board('20 · TV lobby showcase', 'tv', tvLobby),
  board('20 · Phone lobby — deck & rules reflected', 'phone', phoneLobbyDeck),
  board('19 · Opening ceremony — TV', 'tv night', tvCeremony),
  board('19 · Opening ceremony — phone', 'phone night', phoneCeremony),
  board('1 · 2 · 4 · 6 · 8 · 17 — TV day', 'tv', tvDay()),
  board('1 · 2 · 4 · 8 — TV night', 'tv night', tvDay({ night: true })),
  board('13 · Countdown pressure — TV', 'tv', tvDay({ countdown: true })),
  board('11 · Dawn Gazette front page — TV', 'tv', `<div style="position:absolute;inset:0;background:radial-gradient(80% 70% at 50% 100%, #3a2a1c, #100e0d 65%)"></div>${gazette}`),
];
document.getElementById('boards').innerHTML = boards.join('');
document.body.dataset.ready = '1';
</script>
