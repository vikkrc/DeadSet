<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dead Set — Missions, play your card</title>
<link rel="stylesheet" href="../codex.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Grenze+Gotisch:wght@400;600;800&family=Jacquard+24&family=UnifrakturCook:wght@700&display=swap">
<style>body{margin:0}</style>
</head>
<body style="background:#050404">

<div class="ds" style="width:390px;height:844px;padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px">
  <div style="display:flex;justify-content:space-between;align-items:flex-end">
    <div style="display:grid;gap:3px"><span class="lab gilt">Missions · the team has gone</span><h1 class="bl press" style="font-size:46px">Play your card</h1></div>
    <span class="bit gilt" style="font-size:38px">0:24</span>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 6px">
    <span class="trk ok">I</span><span style="flex:1;height:1px;background:#3b3027"></span>
    <span class="trk no">II</span><span style="flex:1;height:1px;background:#3b3027"></span>
    <span class="trk ok">III</span><span style="flex:1;height:1px;background:#3b3027"></span>
    <span class="trk now">IV</span><span style="flex:1;height:1px;background:#3b3027"></span>
    <span class="trk">V</span>
  </div>

  <div class="vellum fr k sm" style="padding:16px 20px;display:grid;gap:3px">
    <span class="lab red">Chapter IV · needs two knives to fail</span>
    <h2 class="bl" style="font-size:30px">Open the vault</h2>
    <p class="it" style="font-size:16.5px;line-height:1.25;color:#5a4632">Dinner is laid for exactly one more guest than you are.</p>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px">
    <button aria-label="Play Succeed" class="card" style="width:100%;font-size:10.6px;border:0;font-family:inherit;transform:translateY(-8px) rotate(-1.5deg);box-shadow:0 0 0 2px #ecd28f,0 0 30px rgba(201,163,90,.55),0 26px 40px -22px #000"><span class="num">Mission</span><span class="art"><img src="../art/succeed.svg" alt=""></span><span class="ttl">Succeed</span></button>
    <button aria-label="Play Sabotage" class="card" style="width:100%;font-size:10.6px;border:0;font-family:inherit;opacity:.82"><span class="num">Mission</span><span class="art"><img src="../art/sabotage.svg" alt=""></span><span class="ttl">Sabotage</span></button>
  </div>
  <p class="it ash" style="text-align:center;font-size:15px">Both cards are the same vellum. A glance tells a neighbour nothing.</p>

  <div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:center"><span class="lab" style="align-self:center">The team</span><span class="chip g">Ada</span><span class="chip g">You</span><span class="chip g">Ed</span><span class="chip g">Gus</span></div>

  <button class="btn seal wide" style="margin-top:auto">Hold · Play Succeed</button>
</div>
</body>
</html>
