<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dead Set — Your role</title>
<link rel="stylesheet" href="../codex.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Grenze+Gotisch:wght@400;600;800&family=Jacquard+24&family=UnifrakturCook:wght@700&display=swap">
<style>body{margin:0}</style>
</head>
<body style="background:#050404">

<div class="ds night" style="width:390px;height:844px;padding:22px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:14px">
  <div style="display:grid;gap:4px;justify-items:center;text-align:center">
    <span class="lab gilt">Night 0 · for your eyes only</span>
    <h1 class="bl press" style="font-size:46px">Your card is dealt</h1>
  </div>

  <div class="card rubric" style="width:272px;font-size:18.2px;margin-top:6px;transform:rotate(1.2deg)">
    <span class="num">XIII</span>
    <div class="art"><img src="../art/death.svg" alt=""></div>
    <h2 class="ttl">Death</h2>
    <p class="sub">Each night the Death team agrees on one shared kill.</p>
    <span class="fac">You walk with Death</span>
  </div>

  <div style="display:grid;gap:8px;justify-items:center;margin-top:10px">
    <span class="lab">Your fellow reaper</span>
    <div style="display:flex;gap:8px"><span class="chip red">Di</span></div>
  </div>

  <button class="btn seal wide" style="margin-top:auto">Hold · Understood</button>
</div>
</body>
</html>
