<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dead Set — Day, accusations</title>
<link rel="stylesheet" href="../codex.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Grenze+Gotisch:wght@400;600;800&family=Jacquard+24&family=UnifrakturCook:wght@700&display=swap">
<style>body{margin:0}</style>
</head>
<body style="background:#050404">

<div class="ds" style="width:390px;height:844px;padding:16px 22px 22px;display:flex;flex-direction:column;gap:14px">
  <header style="display:flex;justify-content:space-between;align-items:center">
    <span class="mark" style="font-size:26px">Dead <span class="red">Set</span></span>
    <div style="display:flex;gap:8px">
      <button class="ico" aria-label="The record"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 6h14v20H10a2 2 0 0 1-2-2zM12 12h6M12 16h6M12 20h4"/></svg></button>
      <button class="ico" aria-label="Menu"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 9h22M5 16h22M5 23h14"/></svg></button>
    </div>
  </header>

  <div style="display:flex;justify-content:space-between;align-items:flex-end">
    <div style="display:grid;gap:3px"><span class="lab gilt">Day II · Discussion</span><h1 class="bl press" style="font-size:50px">Accuse</h1></div>
    <span class="bit gilt" style="font-size:42px">1:59</span>
  </div>
  <div style="display:flex"><span class="plaque live">Majority Rule <small>more than 3.5 weight</small></span></div>

  <div class="table" style="width:312px;margin:24px auto 30px;--t:.66">
    <div class="orbit"></div>
    <div class="disc">
      <img class="inv" src="../art/innocent.svg" alt="" style="width:84px;height:84px">
      <span class="lab" style="font-size:9.5px">Two stand accused</span>
    </div>
    <div class="seat dead" style="left:50%;top:9%"><i>A</i><b>Ada</b></div>
    <div class="seat acc" style="left:82.1%;top:24.4%"><i>B</i><b>Bo</b></div>
    <div class="seat acc" style="left:90%;top:59.1%"><i>C</i><b>Cy</b></div>
    <div class="seat pick" style="left:67.8%;top:86.9%"><i>D</i><b>Di</b></div>
    <div class="seat pick" style="left:32.2%;top:86.9%"><i>E</i><b>Ed</b></div>
    <div class="seat you" style="left:10%;top:59.1%"><i>F</i><b>You</b></div>
    <div class="seat sel" style="left:17.9%;top:24.4%"><i>G</i><b>Gus</b></div>
  </div>

  <div style="display:grid;gap:8px">
    <span class="lab">Spoken before the table</span>
    <div style="display:flex;gap:7px;flex-wrap:wrap"><span class="chip red">Di accuses Bo</span><span class="chip">Ed seconds Bo</span><span class="chip red">Bo accuses Cy</span></div>
  </div>

  <div style="display:flex;gap:10px;margin-top:auto">
    <button class="btn" aria-label="Your card" style="padding:0;width:52px;flex:none"><svg viewBox="0 0 32 32" aria-hidden="true" style="width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.4"><rect x="9" y="4" width="14" height="24" rx="1.5"/><path d="M16 11l3 5-3 5-3-5z"/></svg></button>
    <button class="btn seal" style="flex:1">Accuse Gus</button>
  </div>
</div>
</body>
</html>
