<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dead Set — TV night</title>
<link rel="stylesheet" href="../codex.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Grenze+Gotisch:wght@400;600;800&family=Jacquard+24&family=UnifrakturCook:wght@700&display=swap">
<style>body{margin:0}</style>
</head>
<body style="background:#050404">

<div class="ds tv night" style="width:1600px;height:900px;padding:40px 56px 40px;display:grid;grid-template-columns:390px 1fr 390px;gap:24px;align-items:center">
  <div style="display:grid;gap:18px;align-content:center">
    <span class="mark" style="font-size:40px">Dead <span class="red">Set</span></span>
    <h1 class="bl press" style="font-size:140px;font-weight:800;line-height:.8;margin-top:20px">Night <span style="font:600 .34em 'EB Garamond',serif;letter-spacing:.1em;vertical-align:1.1em">II</span></h1>
    <div class="orn" style="margin-top:26px"><i class="loz o"></i><i class="loz"></i><i class="loz o"></i></div>
    <p class="it dim" style="font-size:30px;line-height:1.2">The bunker sleeps. Something walks between the chairs.</p>
    <p class="lab" style="margin-top:10px">Shield your screens</p>
  </div>

  <div class="table" style="width:630px;margin:0 auto;--t:.4">
    <div class="orbit"></div>
    <span class="rider"></span>
    <div class="disc">
      <span style="width:170px;height:170px;border-radius:50%;border:1px solid #b9c4d8;background:radial-gradient(circle at 30% 35%,rgba(120,140,180,.35) 0 6%,transparent 7%),radial-gradient(circle at 42% 62%,rgba(120,140,180,.3) 0 9%,transparent 10%),linear-gradient(90deg,#dbe1ec 50%,#0d111a 50%);box-shadow:0 0 70px rgba(150,180,240,.45)"></span>
      <span class="lab" style="margin-top:16px">3 of 5 asleep</span>
    </div>
    <div class="seat lg dead" style="left:50%;top:9%"><i>A</i><b>Ada</b></div>
    <div class="seat lg dead" style="left:82.1%;top:24.4%"><i>B</i><b>Bo</b></div>
    <div class="seat lg" style="left:90%;top:59.1%"><i>C</i><b>Cy</b></div>
    <div class="seat lg" style="left:67.8%;top:86.9%"><i>D</i><b>Di</b></div>
    <div class="seat lg" style="left:32.2%;top:86.9%"><i>E</i><b>Ed</b></div>
    <div class="seat lg" style="left:10%;top:59.1%"><i>F</i><b>Fay</b></div>
    <div class="seat lg" style="left:17.9%;top:24.4%"><i>G</i><b>Gus</b></div>
  </div>

  <div style="display:grid;gap:22px;align-content:center;justify-items:end;text-align:right">
    <span class="bit gilt" style="font-size:100px">1:12</span>
    <span class="lab">Until the night resolves</span>
    <div class="fr s" style="padding:28px 30px;display:grid;gap:10px;justify-items:end;margin-top:20px;background:rgba(13,17,26,.6)">
      <span class="lab gilt">Yesterday</span>
      <p class="bl" style="font-size:38px">Bo was sentenced</p>
      <span class="beads"><i></i><i></i><i></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i></span>
      <p class="it dim" style="font-size:20px">Four of seven. What Bo was, the dead keep.</p>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end"><span class="plaque">Majority Rule</span><span class="plaque">Cursed Silence</span></div>
  </div>
</div>
</body>
</html>
