<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dead Set — TV Exorcism</title>
<link rel="stylesheet" href="../codex.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Grenze+Gotisch:wght@400;600;800&family=Jacquard+24&family=UnifrakturCook:wght@700&display=swap">
<style>
body{margin:0}
.said{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid #342c4a}
.said i{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid #6a5b96;font:600 21px/1 'Grenze Gotisch',serif;font-style:normal}
.said b{font:600 34px/1 'Grenze Gotisch',serif}
.said small{display:block;font:600 11.5px/1 'EB Garamond',serif;letter-spacing:.2em;text-transform:uppercase;color:#8a80a3;margin-bottom:3px}
</style>
</head>
<body style="background:#050404">

<div class="ds tv mist" style="width:1600px;height:900px;padding:40px 56px 40px;display:grid;grid-template-columns:400px 1fr 340px;gap:30px;align-items:center;--glow:rgba(210,58,53,.16)">
  <div style="display:grid;gap:18px;align-content:center">
    <span class="mark" style="font-size:40px">Dead <span class="red">Set</span></span>
    <span class="lab gilt" style="margin-top:22px">Exorcism · round I</span>
    <h1 class="bl press" style="font-size:112px;font-weight:800;line-height:.84">Name the Demon</h1>
    <div class="orn" style="margin-top:22px"><i class="loz o"></i><i class="loz"></i><i class="loz o"></i></div>
    <div style="display:flex;gap:12px;align-items:center"><span class="lab">The category</span><span class="chip g">Things that go bump</span></div>
    <span class="bit gilt" style="font-size:96px;margin-top:8px">0:31</span>
  </div>

  <div style="position:relative;width:620px;height:620px;margin:0 auto">
    <div class="ball red" style="position:absolute;inset:16%">
      <svg viewBox="0 0 300 300" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%"><defs><path id="ring" d="M150 150m-124 0a124 124 0 1 1 248 0a124 124 0 1 1-248 0"/></defs><circle cx="150" cy="150" r="136" fill="none" stroke="#f0b0a8" stroke-opacity=".35"/><circle cx="150" cy="150" r="108" fill="none" stroke="#f0b0a8" stroke-opacity=".35" stroke-dasharray="1 5"/><text fill="#f0b0a8" fill-opacity=".8" font-family="EB Garamond, serif" font-size="11" font-weight="600" letter-spacing="5"><textPath href="#ring">SPIRITVS · VERBVM · VMBRA · SILENTIVM · NOMEN · SPIRITVS · VERBVM · VMBRA · SILENTIVM ·</textPath></text></svg>
      <span class="bit" style="position:relative;font-size:170px;line-height:.9;color:#ffe9e2;text-shadow:0 0 30px rgba(255,90,80,.9)">4</span>
      <span class="lab" style="position:relative;color:#e9c3bb;margin-top:18px">of 7 have named</span>
    </div>
    <div class="seat lg" style="left:50%;top:7%"><i>A</i><b>Ada</b></div>
    <div class="seat lg" style="left:83.6%;top:23.2%"><i>B</i><b>Bo</b></div>
    <div class="seat lg" style="left:91.9%;top:59.6%"><i>C</i><b>Cy</b></div>
    <div class="seat lg" style="left:68.7%;top:88.7%"><i>D</i><b>Di</b></div>
    <div class="seat lg" style="left:31.3%;top:88.7%"><i>E</i><b>Ed</b></div>
    <div class="seat lg" style="left:8.1%;top:59.6%;opacity:.5"><i style="border-style:dashed">F</i><b>Fay</b></div>
    <div class="seat lg" style="left:16.4%;top:23.2%"><i>G</i><b>Gus</b></div>
  </div>

  <div style="display:grid;align-content:center">
    <div class="orn" style="margin-bottom:10px"><span class="lab gilt">What was said</span></div>
    <div class="said"><i>A</i><span><small>Ada</small><b>knock</b></span></div>
    <div class="said"><i>B</i><span><small>Bo</small><b>plates</b></span></div>
    <div class="said"><i>C</i><span><small>Cy</small><b>cold</b></span></div>
    <div class="said"><i>D</i><span><small>Di</small><b>attic</b></span></div>
    <div class="said"><i>E</i><span><small>Ed</small><b>night</b></span></div>
    <div class="said" style="opacity:.55"><i>F</i><span><small>Fay</small><span class="it" style="font-size:22px">the sand ran out</span></span></div>
    <div class="said" style="border-bottom:0"><i>G</i><span><small>Gus</small><b>noise</b></span></div>
  </div>
</div>
</body>
</html>
