<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dead Set — Home</title>
<link rel="stylesheet" href="../codex.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Grenze+Gotisch:wght@400;600;800&family=Jacquard+24&family=UnifrakturCook:wght@700&display=swap">
<style>body{margin:0}</style>
</head>
<body style="background:#050404">

<div class="ds" style="width:390px;height:844px;padding:18px 22px 22px;display:flex;flex-direction:column;gap:16px">
  <header style="display:flex;justify-content:space-between;align-items:center">
    <button class="ico" aria-label="Sound"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 22V14a7 7 0 0 1 14 0v8l2 3H7z"/><path d="M14 28h4"/></svg></button>
    <a class="btn sm" href="#rules" style="padding:0 30px">How to play</a>
  </header>

  <div style="display:grid;justify-items:center;gap:6px">
    <div style="width:196px;height:216px;clip-path:var(--arch);background:#8a6d35;padding:1.5px">
      <div style="width:100%;height:100%;clip-path:var(--arch);background:radial-gradient(circle at 50% 56%,#3d1513,#0c0a09 72%)">
        <img class="inv" src="../art/death.svg" alt="" style="width:100%;height:100%;object-fit:contain;padding:44px 14px 8px">
      </div>
    </div>
    <h1 class="mark press" style="font-size:84px;white-space:nowrap;line-height:1">Dead <span class="red">Set</span></h1>
  </div>

  <div class="orn"><i class="loz o"></i><i class="loz"></i><i class="loz o"></i></div>
  <p class="it dim" style="text-align:center;font-size:19px;line-height:1.25">“Bo was found dead. Nobody saw the Whore leave.”</p>

  <div class="seg" style="margin-top:4px"><button class="on">Host a table</button><button>Join a table</button></div>
  <label class="field"><span class="lab">Sign your name</span><input placeholder="e.g. Morgan" aria-label="Your name"></label>
  <label style="display:flex;gap:12px;align-items:flex-start;min-height:44px">
    <input type="checkbox" style="appearance:none;flex:none;width:22px;height:22px;margin:3px 0 0;border:1px solid #8a6d35;background:#15110e">
    <span style="display:grid;gap:1px"><span style="font-size:18px;line-height:1.2">I’ll moderate, not play</span><span class="it ash" style="font-size:14.5px">Sees every secret, holds no seat. Everyone is told.</span></span>
  </label>
  <button class="btn bone wide" style="margin-top:auto">Pull up a chair</button>
  <p class="lab" style="text-align:center;font-size:10px">5–13 players · one phone each · no app</p>
</div>
</body>
</html>
