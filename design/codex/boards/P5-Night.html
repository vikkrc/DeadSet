<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dead Set — Night, Dream and action</title>
<link rel="stylesheet" href="../codex.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Grenze+Gotisch:wght@400;600;800&family=Jacquard+24&family=UnifrakturCook:wght@700&display=swap">
<style>body{margin:0}</style>
</head>
<body style="background:#050404">

<div class="ds night" style="width:390px;height:844px;padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px">
  <div style="display:flex;justify-content:space-between;align-items:flex-end">
    <div style="display:grid;gap:3px"><span class="lab gilt">Night II · your eyes only</span><h1 class="bl press" style="font-size:44px">The Mentalist wakes</h1></div>
    <span class="bit gilt" style="font-size:38px">0:48</span>
  </div>

  <div class="fr s sm" style="display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:center;padding:16px 18px;background:rgba(13,17,26,.7)">
    <div class="card dream" style="width:92px;font-size:6.2px"><span class="num">Dream</span><div class="art"><img src="../art/nightshift.svg" alt=""></div><span class="ttl" style="font-size:1.9em">Night Shift</span></div>
    <div style="display:grid;gap:4px">
      <span class="lab">Tonight you dream</span>
      <h2 class="bl" style="font-size:30px">Night Shift</h2>
      <p class="it dim" style="font-size:16.5px;line-height:1.25">One extra reading, on a second player.</p>
    </div>
  </div>

  <div class="table" style="width:296px;margin:26px auto 28px;--t:.4">
    <div class="orbit"></div>
    <div class="disc">
      <span style="width:58px;height:58px;border-radius:50%;border:1px solid #b9c4d8;background:linear-gradient(90deg,#dbe1ec 50%,#0d111a 50%);box-shadow:0 0 26px rgba(150,180,240,.45)"></span>
      <span class="lab" style="font-size:9.5px;margin-top:8px">3 of 6 asleep</span>
    </div>
    <div class="seat dead" style="left:50%;top:9%"><i>A</i><b>Ada</b></div>
    <div class="seat sel" style="left:82.1%;top:24.4%"><i>B</i><b>Bo</b></div>
    <div class="seat pick" style="left:90%;top:59.1%"><i>C</i><b>Cy</b></div>
    <div class="seat pick" style="left:67.8%;top:86.9%"><i>D</i><b>Di</b></div>
    <div class="seat sel" style="left:32.2%;top:86.9%"><i>E</i><b>Ed</b></div>
    <div class="seat you" style="left:10%;top:59.1%"><i>F</i><b>You</b></div>
    <div class="seat pick" style="left:17.9%;top:24.4%"><i>G</i><b>Gus</b></div>
  </div>

  <p class="it dim" style="text-align:center;font-size:18px">Whose heart will you read? <span class="gilt">Bo</span> and <span class="gilt">Ed</span>.</p>

  <div style="display:grid;gap:6px;margin-top:auto">
    <button class="btn bone wide">Hold · Read them and sleep</button>
    <button class="btn ghost sm wide">Cover my screen</button>
  </div>
</div>
</body>
</html>
